id: mistral
name: Mistral
logo: mistral.svg
country: France
blurb: States that data sent through the API is not used for training, with a training
  opt-out that is a separate control from retention. Zero data retention is granted
  on request and reviewed case by case, and covers stateless calls such as chat, embeddings,
  OCR and speech, but not stateful products such as Batch and the Files API. Inference
  runs on GPU infrastructure Mistral manages, including third-party models such as
  GLM, and the EU endpoint pins processing to EU and EFTA data centres at a 10% upcharge.
