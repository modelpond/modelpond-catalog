---
id: melious
name: Melious
logo: melious.svg
country: Germany
blurb: >-
  Melious AI GmbH routes open-weight inference across European partner providers
  and says requests never leave the EU, with no US or APAC fallback. Its DPA promises
  zero data retention for Melious-operated servers and the providers marked in its
  subprocessor annex: inputs and outputs stay in volatile memory and are neither
  logged nor used for training. Stateful Batch, Files, vector-store and vault content,
  operational metadata, and unmarked upstream infrastructure sit outside that zero-retention
  commitment; Melious itself records request IDs, token counts, model and provider,
  cost and energy figures, but not prompt or response text.
