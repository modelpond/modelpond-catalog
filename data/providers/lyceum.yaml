country: Germany
blurb: Runs open-weight models on serverless GPUs in Paris and Finland with an OpenAI-compatible
  API. Its legal documentation says prompts and outputs are never written to disk
  or logged, request records contain usage metadata but no prompt or response text,
  and recent prompt prefixes exist only in GPU memory as a cache. Dedicated endpoint
  locations are agreed per workload, including a requested EU location. The DPA covers
  GDPR processing; ISO 27001 audit is in progress, not yet certified.
